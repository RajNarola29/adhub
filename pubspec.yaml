name: adhub
description: "A Flutter package that simplifies ad integration with a unified API for banner, interstitial, and rewarded ads."
version: 0.2.4
homepage:

environment:
  sdk: ^3.10.4
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.1
  dio: ^5.11.0
  flutter_hooks: ^0.21.3+1
  in_app_review: ^2.0.12
  package_info_plus: ^10.2.1
  google_mobile_ads: ^9.0.0
  applovin_max: ^4.6.4
  app_tracking_transparency: ^2.0.7
  onesignal_flutter: ^5.6.7
  firebase_core: ^4.13.0
  firebase_messaging: ^16.5.0
  flutter_local_notifications: ^22.3.0
  url_launcher: ^6.3.2
  loading_animation_widget: ^1.2.1
  shared_preferences: ^2.5.5
  flutter_svg: ^2.3.0
  permission_handler: ^13.0.0

flutter:
  assets:
    - assets/logos/dark-logo.svg
    - assets/logos/dark-name.svg
    - assets/logos/light-logo.svg
    - assets/logos/light-name.svg
  plugin:
    platforms:
      android:
        package: com.adhub.adhub
        pluginClass: AdhubPlugin
      ios:
        pluginClass: AdhubPlugin

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0